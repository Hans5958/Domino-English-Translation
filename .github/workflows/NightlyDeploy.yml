on:
  schedule:
    - cron: "0 0 * * *"

name: Nightly Deployment

jobs:
  check:
    name: Changes Check
    runs-on: ubuntu-latest
    outputs:
      HAS_COMMITS: ${{ steps.check.outputs.HAS_COMMITS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Get last run date
        id: last-run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/NightlyDeploy.yml/runs" -F status=success -F per_page=5 \
            --jq '.workflow_runs | map(select(.id != ${{ github.run_id }}) and (.head_sha != null)) | .[0]' 2>/dev/null || true)
          if [ -z "$LAST_RUN" ] || [ "$LAST_RUN" = "null" ]; then
            echo "No previous successful run found. Using 48 hours ago."
            FROM_DATE=$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          else
            FROM_DATE=$(echo "$LAST_RUN" | jq -r '.created_at')
            echo "Last successful run started at $FROM_DATE"
          fi
          echo "FROM_DATE=$FROM_DATE" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check
        run: |
          FROM_COMMIT=$(git rev-list -n1 --before="${{ steps.last-run.outputs.FROM_DATE }}" --first-parent HEAD)
          if ! git rev-parse --verify --quiet "$FROM_COMMIT" >/dev/null; then
            echo "No new commits since last run. Skipping deployment."
            echo "HAS_COMMITS=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found commits since last run: $FROM_COMMIT"
          CHANGED=$(git diff $FROM_COMMIT..HEAD --name-only | grep -E '^((Dialog)|(Manual)|(Menu)|(Module)|(Other)|(StringTable)|(System)|(VersionInfo)|(240)|(1\.\d{2,})|\/)' || true)
          if [ -z "$CHANGED" ]; then
            echo "No translated files changed since last run. Skipping deployment."
            echo "HAS_COMMITS=false" >> "$GITHUB_OUTPUT"
          else
            echo "Translated files changed. Continuing."
            echo "HAS_COMMITS=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deployment
    runs-on: windows-latest
    needs: check
    if: needs.check.outputs.HAS_COMMITS == 'true'
    defaults:
      run:
        shell: bash
    steps:
    
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install required packages
        run: choco install reshack

      - name: Build
        id: build
        run: |
          cd _script
          bash workflow/build-all-nightly.sh
          
      - name: Write release body
        # run: |
        #   echo "\
        #   ## Release Notes
        #   " >> release.txt
        #   if [ ! -s _deploy/release-notes.md ]; then
        #     echo '${{github.event.head_commit.message}}' >> release.txt
        #   else
        #     cat _deploy/release-notes.md >> release.txt
        #   fi
        #   echo "\

        #   ## Commits
        #   " >> release.txt
        #   for row in $(echo '${{toJSON(github.event.commits)}}' | jq -r '.[] | @base64'); do
        #       _jq() {
        #       echo ${row} | base64 --decode | jq -r ${1}
        #       }
        #     echo - $(_jq '.id') $(_jq '.message' | awk '{gsub(/\\n/,"\n")}1' | head -1) \($(_jq '.committer.username')\) >> release.txt
        #   done
        #   echo "\

        #   ----

        #   *Commit pushed by ${{github.event.head_commit.author.name}} (${{github.event.head_commit.author.username}}) on ${{github.event.head_commit.timestamp}}*
        #   *Built on ${{steps.build.outputs.BUILD_DATE_TIDY}}*" >> release.txt
        
        run: |
          echo "\
          ## Release Notes 
          " >> release.txt
          if [ ! -s _deploy/release-notes.md ]; then
            echo "*No release notes supplied.*" >> release.txt
          else
            cat _deploy/release-notes.md >> release.txt
          fi
          echo "\

          ----

          *Built on ${{steps.build.outputs.BUILD_DATE_FULL}}.*" >> release.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          tag_name: en.${{steps.build.outputs.VERSION_NUM}}-nightly.${{steps.build.outputs.BUILD_DATE}}
          name: Build ${{steps.build.outputs.VERSION_NUM}} (Nightly ${{steps.build.outputs.BUILD_DATE_TIDY}})
          prerelease: true
          files: |
            _script/dist/Domino143_Translated.zip
            _script/dist/Domino143_Translated.exe
            _script/dist/Domino144_Translated.zip
            _script/dist/Domino144_Translated.exe
            _script/dist/Domino145_dev009_x86_Translated.zip
            _script/dist/Domino145_dev009_x86_Translated.exe
            _script/dist/Domino145_dev009_x64_Translated.zip
            _script/dist/Domino145_dev009_x64_Translated.exe
          body_path: release.txt
          
